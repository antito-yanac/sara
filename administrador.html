<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <title>Panel de Administración - SARA</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/recursos.css">

    <style>
        :root {
            color-scheme: dark;
            --bg: #121212;
            --panel: #1e1e1e;
            --border: #333;
            --text: #e0e0e0;
            --text-muted: #aaa;
            --rojo: #e74c3c;
            --verde: #2ecc71;
            --azul: #3498db;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-width: 0;
            height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            background-color: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            touch-action: manipulation;
        }

        /* --- LOGIN --- */
        #login-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: var(--bg);
        }

        .login-box {
            width: min(360px, 100%);
            padding: clamp(20px, 6vw, 30px);
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
            text-align: center;
        }

        .login-box h2 {
            margin-top: 0;
            color: var(--azul);
        }

        .login-box input {
            width: 100%;
            min-height: 44px;
            margin: 10px 0;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
        }

        .login-box button {
            width: 100%;
            min-height: 44px;
            margin-top: 10px;
            padding: 10px;
            border: 0;
            border-radius: 6px;
            background: var(--azul);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #2980b9;
        }

        .login-box button:focus-visible,
        .login-box input:focus-visible,
        button:focus-visible {
            outline: 2px solid #8ecfff;
            outline-offset: 2px;
        }

        #login-error {
            display: none;
            margin-top: 10px;
            color: var(--rojo);
            font-size: 13px;
        }

        /* --- LAYOUT PRINCIPAL --- */
        #app-screen {
            /* El módulo de login puede mostrarlo cambiando su display a flex. */
            display: none;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            min-width: 0;
            min-height: 0;
        }

        /* --- SIDEBAR (Usuarios) --- */
        #sidebar {
            display: flex;
            flex: 0 0 320px;
            flex-direction: column;
            width: 320px;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            border-right: 1px solid var(--border);
            background: var(--panel);
        }

        .sidebar-header {
            position: relative;
            z-index: 10;
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 15px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }

        .sidebar-header h3 {
            margin: 0;
            font-size: 16px;
        }

        .btn-logout {
            min-height: 40px;
            padding: 6px 12px;
            border: 1px solid var(--rojo);
            border-radius: 6px;
            background: transparent;
            color: var(--rojo);
            font-size: 13px;
            cursor: pointer;
        }

        #usuarios-lista {
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            overscroll-behavior: contain;
        }

        .user-card {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .user-card.inactivo {
            opacity: 0.6;
        }

        .user-card strong {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
        }

        .user-card span {
            display: block;
            margin-bottom: 2px;
            color: var(--text-muted);
        }

        .user-card .btn-toggle {
            width: 100%;
            min-height: 40px;
            margin-top: 8px;
            padding: 7px 10px;
            border: 0;
            border-radius: 5px;
            background: var(--border);
            color: #fff;
            cursor: pointer;
        }

        .user-card .btn-toggle:hover {
            background: #444;
        }

        /* --- MAPA Y ALERTAS --- */
        #main-content {
            position: relative;
            display: flex;
            flex: 1 1 auto;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }

        #map {
            width: 100%;
            height: 100%;
            min-height: 0;
            z-index: 1;
        }

        #alertas-container {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: min(350px, calc(100% - 30px));
            max-height: calc(100dvh - 30px);
            overflow-y: auto;
            overscroll-behavior: contain;
            pointer-events: none;
        }

        .alerta-card {
            padding: 12px;
            border-left: 4px solid var(--rojo);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: 0 4px 12px rgb(0 0 0 / 50%);
            pointer-events: auto;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        .alerta-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .alerta-header h4 {
            margin: 0;
            color: var(--rojo);
            font-size: 14px;
        }

        .alerta-time {
            color: var(--text-muted);
            font-size: 11px;
        }

        .alerta-data {
            margin-bottom: 8px;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .alerta-data b {
            color: #fff;
        }

        .alerta-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .alerta-actions button {
            flex: 1 1 0;
            min-height: 40px;
            padding: 7px;
            border: 0;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-atender {
            background: var(--verde);
            color: #000;
        }
                .alerta-card.alerta-atendida {
            border: 1px solid var(--verde);
        }
        .alerta-card.alerta-atendida .alerta-header h4 {
            color: var(--verde);
        }
        .btn-finalizar {
            background: var(--azul);
            color: #fff;
        }
        .btn-atender:disabled {
            opacity: 0.55;
            cursor: default;
        }
        .btn-ubicar {
            background: var(--azul);
            color: #fff;
        }

        .empty-state {
            padding: 20px;
            border-radius: 8px;
            background: var(--panel);
            color: var(--text-muted);
            text-align: center;
            pointer-events: auto;
        }

        /* Tablets: reservar espacio para el mapa sin comprimir los controles. */
        @media (max-width: 900px) {
            #sidebar {
                flex-basis: clamp(230px, 30vw, 280px);
                width: clamp(230px, 30vw, 280px);
            }

            #alertas-container {
                width: min(320px, calc(100% - 24px));
                top: 12px;
                right: 12px;
                max-height: calc(100dvh - 24px);
            }
        }

        /* Móviles en vertical: usuarios arriba y mapa ocupando el espacio restante. */
        @media (max-width: 640px) {
            #app-screen {
                flex-direction: column;
            }

            #sidebar {
                flex: 0 0 clamp(150px, 31dvh, 235px);
                width: 100%;
                height: clamp(150px, 31dvh, 235px);
                border-right: 0;
                border-bottom: 1px solid var(--border);
            }

            .sidebar-header {
                padding: 10px 12px;
            }

            #main-content {
                flex: 1 1 0;
            }

            #alertas-container {
                top: 8px;
                right: 8px;
                left: 8px;
                width: auto;
                max-height: min(38dvh, 250px);
                gap: 8px;
            }

            .alerta-card {
                padding: 10px;
            }

            .alerta-data {
                font-size: 12px;
            }
        }

        /* En móvil horizontal, el diseño lateral aprovecha mejor la poca altura. */
        @media (max-width: 760px) and (orientation: landscape) and (max-height: 520px) {
            #app-screen {
                flex-direction: row;
            }

            #sidebar {
                flex: 0 0 clamp(180px, 30vw, 235px);
                width: clamp(180px, 30vw, 235px);
                height: 100%;
                border-right: 1px solid var(--border);
                border-bottom: 0;
            }

            #alertas-container {
                top: 8px;
                right: 8px;
                left: auto;
                width: min(290px, 45%);
                max-height: calc(100dvh - 16px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>🔐 Admin Panel</h2>
            <p style="font-size: 13px; color: #888;">Ingresa tus credenciales</p>
            <input type="email" id="login-email" placeholder="Correo electrónico" autocomplete="username">
            <input type="password" id="login-password" placeholder="Contraseña" autocomplete="current-password">
            <button id="btn-login">Ingresar</button>
            <div id="login-error"></div>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL (oculta hasta loguearse) -->
    <div id="app-screen">
        <!-- SIDEBAR IZQUIERDO (Usuarios) -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <h3>👥 Usuarios</h3>
                <button class="btn-logout" id="btn-logout">Salir</button>
            </div>
            <div id="usuarios-lista">
                <!-- Aquí se inyectan los usuarios -->
            </div>
        </aside>

        <!-- MAPA Y ALERTAS -->
        <main id="main-content">
            <div id="map"></div>
            <div id="alertas-container">
                <!-- Aquí se inyectan las alertas -->
                <div class="empty-state" id="empty-alertas">No hay alertas pendientes</div>
            </div>
        </main>
    </div>
    <script type="module" src="./js/recursos-admin.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Módulo Lógico -->
    <script type="module" src="./js/admin-panel.js"></script>
</body>
</html>
