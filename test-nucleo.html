<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Test Núcleo</title></head>
<body>
  <h1>Test Núcleo</h1>
  <pre id="out">Cargando...</pre>
  <script type="module">
    import { asegurarSesionAnonima } from "./js/auth-anonima.js";
    import { obtenerDeviceId, detectarEquipo } from "./js/device-id.js";
    const out = document.getElementById("out");
    try {
      const user = await asegurarSesionAnonima();
      const deviceId = obtenerDeviceId();
      out.textContent = JSON.stringify({
        authUid: user.uid,
        deviceId,
        equipo: detectarEquipo()
      }, null, 2);
    } catch (e) {
      out.textContent = "ERROR: " + e.message;
    }
  </script>
</body>
</html>
