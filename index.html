<body>

<div class="app">

    <!-- MAPA A PANTALLA COMPLETA -->
    <main id="map-container">
        <div id="map"></div>

    </main>


    <!-- CABECERA -->
    <section class="top-ui">

        <div class="left-ui">

            <div class="brand">

                <div class="brand-icon">
                    ⚡
                </div>

                <div>
                    <div class="brand-name">
                        ANTAMINA
                    </div>

                    <div class="brand-subtitle">
                        Keraunos
                    </div>
                </div>

            </div>

        </div>

    </section>

    <!-- TARJETA INFERIOR -->
    <section
        class="info"
        id="info-panel">

        <div class="vigilance-kicker">
            VIGILANCIA
        </div>

        <div
            class="vigilance-meta"
            id="info-content">

            <div class="vigilance-line">

                <span>🟢</span>

                <span>
                    <strong>Estado:</strong>
                    Sin alertas meteorológicas
                </span>

            </div>

            <div class="vigilance-line">

                <span>📍</span>

                <span>
                    <strong>Sistema:</strong>
                    En vigilancia
                </span>

            </div>

        </div>

    </section>


    <footer class="footer">
        Antamina · Información meteorológica · 2026
    </footer>

</div>
