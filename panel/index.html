<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS - Centro de Control</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; background: #111; color: #fff; }
    #map { flex: 2; }
    #sidebar { flex: 1; background: #1a1a1a; padding: 15px; overflow-y: auto; border-left: 2px solid #333; }
    h3 { border-bottom: 1px solid #444; padding-bottom: 5px; }
    .alerta-item { background: #400; border-left: 4px solid #f00; padding: 10px; margin-bottom: 10px; font-size: 14px; border-radius: 4px;}
    .unidad-item { background: #222; padding: 10px; margin-bottom: 10px; font-size: 14px; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="sidebar">
    <h3>🚨 Alertas Activas</h3>
    <div id="listaAlertas">Cargando...</div>
    <h3 style="margin-top: 30px;">🚑 Unidades en Campo</h3>
    <div id="listaUnidades"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./panel.js"></script>
</body>
</html>
