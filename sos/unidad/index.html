<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS - Ambulancia</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: sans-serif; background: #111; color: #fff; }
    #map { height: 50vh; width: 100%; }
    .panel { padding: 15px; }
    .alerta-card { background: #400; border: 2px solid #f00; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: none; }
    .btn { padding: 10px 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; margin-right: 10px; }
    .btn-ok { background: #0a0; color: white; }
    .btn-no { background: #555; color: white; }
    .header { padding: 10px; background: #222; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header" id="header">Iniciando unidad...</div>
  <div id="map"></div>
  <div class="panel">
    <div id="alertaBox" class="alerta-card">
      <h3>🚨 ¡EMERGENCIA CERCANA!</h3>
      <p id="alertaInfo"></p>
      <button id="btnAceptar" class="btn btn-ok">ACEPTAR E IR</button>
      <button id="btnRechazar" class="btn btn-no">IGNORAR</button>
    </div>
    <div id="status">Buscando alertas...</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./unidad.js"></script>
</body>
</html>
