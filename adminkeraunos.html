<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔔 Editor estado.json — Keraunos</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/panico.css">
<link rel="stylesheet" href="css/alerts.css">
<link rel="stylesheet" href="css/adminkeraunos.css">
</head>
<body>

<div class="admin-container admin-panel-wide" id="panel-container">

    <div class="admin-header">
        <h1><span class="icon">🔔</span> Editor estado.json</h1>
        <p>Configura el nivel y la duración de cada zona. Descarga el JSON y súbelo a GitHub.</p>
        <div class="pa-modo-badge">⚙️ MODO MANUAL</div>
    </div>

    <!-- Estado de carga -->
    <div class="pa-fb-status" id="pa-estado-carga">
        <span class="pa-dot" id="pa-dot"></span>
        <span id="pa-carga-texto">Cargando estado.json…</span>
    </div>

    <!-- ============================================================
         Sección: Zonas (4 tarjetas grandes, cada una con 3 niveles)
         ============================================================ -->
    <section>
        <div class="pa-na-titulo">⚡ CONFIGURAR ZONAS</div>
        <div class="pa-zonas-lista" id="pa-zonas-lista"></div>
    </section>

    <!-- Resumen -->
    <div class="pa-resumen" id="pa-resumen"></div>

    <!-- ============================================================
         Botones de acción
         ============================================================ -->
    <button type="button" class="pa-btn-enviar" id="pa-btn-descargar">
        💾 DESCARGAR estado.json
    </button>

    <button type="button" class="pa-btn-reset" id="pa-btn-reset">
        🔄 RESETEAR TODO A VERDE
    </button>

    <button type="button" class="pa-btn-reset" id="pa-btn-copiar">
        📋 COPIAR JSON AL PORTAPAPELES
    </button>

    <!-- Vista previa del JSON -->
    <section class="pa-mi-section">
        <button type="button" class="pa-mi-toggle" id="pa-mi-toggle">
            ▸ 👁️ Vista previa del JSON (opcional)
        </button>
        <div class="pa-mi-campos" id="pa-mi-campos" style="display:none;">
            <pre id="pa-json-preview" class="pa-json-preview"></pre>
        </div>
    </section>

    <!-- Barra de estado -->
    <div class="status-bar" id="status-bar"></div>
</div>

<!-- Modal de confirmación -->
<div class="modal-overlay" id="modal-confirm">
    <div class="modal-box" id="modal-box">
        <div class="modal-icon" id="modal-icon">❓</div>
        <h3 id="modal-titulo">¿Confirmar?</h3>
        <div id="modal-mensaje" class="pa-modal-msg-lista"></div>
        <div class="modal-buttons">
            <button type="button" class="btn btn-cancelar" id="modal-btn-cancelar">✖ Cancelar</button>
            <button type="button" class="btn btn-enviar" id="modal-btn-aceptar">✅ Aceptar</button>
        </div>
    </div>
</div>

<script type="module" src="js/adminkeraunos.js"></script>
</body>
</html>
